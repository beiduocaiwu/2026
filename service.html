<style>
:root {
  --blue-deep: #0A1F3F; --blue-dark: #132D54; --blue-mid: #1B4F8A; --blue: #2563EB;
  --blue-light: #3B82F6; --blue-soft: #EFF6FF; --gold: #C8922B; --gold-light: #F0C060;
  --white: #FFFFFF; --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB;
  --gray-300: #D1D5DB; --gray-400: #9CA3AF; --gray-500: #6B7280; --gray-600: #4B5563;

  --radius: 12px; --shadow-lg: 0 20px 50px -12px rgba(0,0,0,0.12);
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; color: var(--gray-700); background: var(--white); line-height:1.7; }

.container { max-width:1200px; margin:0 auto; padding:0 24px; }

/* Nav */
.nav { position:fixed; top:0; left:0; right:0; z-index:1000; padding:14px 0; background: rgba(10,31,63,0.97); backdrop-filter: blur(16px); }
.nav-inner { max-width:1200px; margin:0 auto; padding:0 24px; display:flex; align-items:center; justify-content:space-between; }
.nav-logo { display:flex; align-items:center; gap:12px; text-decoration:none; }
.nav-logo-img { height:36px; width:auto; }
.nav-back { color: var(--gold-light); text-decoration:none; font-size:14px; display:flex; align-items:center; gap:6px; transition: color 0.3s; }
.nav-back:hover { color: var(--white); }

/* Hero */
.hero { padding:120px 0 60px; background:linear-gradient(135deg, var(--blue-deep), var(--blue-mid)); color:var(--white); text-align:center; }
.hero-icon { width:80px; height:80px; background:rgba(255,255,255,0.1); border-radius:20px; display:flex; align-items:center; justify-content:center; margin:0 auto 24px; font-size:36px; }
.hero h1 { font-size:36px; font-weight:800; margin-bottom:12px; }
.hero p { font-size:16px; opacity:0.8; max-width:600px; margin:0 auto; }

/* Content */
.content-section { padding:60px 0; }
.content-grid { display:grid; grid-template-columns:1fr 380px; gap:60px; align-items:start; }
.content-main h2 { font-size:24px; font-weight:700; color:var(--gray-900); margin-bottom:16px; }
.content-main h3 { font-size:18px; font-weight:600; color:var(--gray-800); margin:32px 0 12px; }
.content-main p, .content-main li { font-size:15px; color:var(--gray-600); margin-bottom:8px; }
.content-main ul { padding-left:20px; margin-bottom:16px; }
.content-main ul li { margin-bottom:6px; }

/* Feature cards */
.features { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:24px; }
.feature-card { background:var(--blue-soft); border-radius:12px; padding:24px; text-align:center; }
.feature-card i { font-size:28px; color:var(--blue); margin-bottom:10px; }
.feature-card h4 { font-size:15px; font-weight:600; color:var(--gray-800); margin-bottom:6px; }
.feature-card p { font-size:13px; color:var(--gray-500); margin:0; }

/* Sidebar Form */
.form-card { background:var(--white); border-radius:16px; padding:32px; box-shadow:var(--shadow-lg); border:1px solid var(--gray-200); position:sticky; top:100px; }
.form-card h3 { font-size:20px; font-weight:700; color:var(--gray-900); margin-bottom:8px; }
.form-card .subtitle { font-size:13px; color:var(--gray-400); margin-bottom:24px; }
.form-group { margin-bottom:16px; }
.form-group label { display:block; font-size:13px; font-weight:600; color:var(--gray-600); margin-bottom:6px; }
.form-group input, .form-group select, .form-group textarea { width:100%; padding:10px 14px; border:1px solid var(--gray-200); border-radius:8px; font-size:14px; color:var(--gray-800); transition:border 0.3s; outline:none; font-family:inherit; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--blue); }
.form-group textarea { height:80px; resize:vertical; }
.btn-submit { width:100%; padding:12px; background:linear-gradient(135deg, var(--gold), var(--gold-light)); color:var(--white); border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; transition:0.3s; }
.btn-submit:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(200,146,43,0.3); }
.btn-submit:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
.form-success { display:none; text-align:center; padding:40px 20px; }
.form-success i { font-size:48px; color:#10B981; margin-bottom:16px; }
.form-success h3 { color:var(--gray-900); margin-bottom:8px; }
.form-success p { color:var(--gray-500); font-size:14px; }

/* Process */
.process { display:flex; gap:0; margin-top:24px; }
.process-step { flex:1; text-align:center; position:relative; }
.process-step::after { content:''; position:absolute; top:18px; right:-50%; width:100%; height:2px; background:var(--gray-200); }
.process-step:last-child::after { display:none; }
.process-num { width:36px; height:36px; background:var(--blue); color:var(--white); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 10px; font-size:14px; font-weight:700; }
.process-step h4 { font-size:13px; font-weight:600; color:var(--gray-700); margin-bottom:4px; }
.process-step p { font-size:11px; color:var(--gray-400); margin:0; }

/* CTA Banner */
.cta-banner { background:linear-gradient(135deg, var(--blue-deep), var(--blue-mid)); border-radius:16px; padding:40px; margin-top:60px; text-align:center; color:var(--white); }
.cta-banner h2 { font-size:24px; font-weight:700; margin-bottom:8px; }
.cta-banner p { font-size:15px; opacity:0.8; margin-bottom:20px; }
.cta-banner .btn-cta { display:inline-block; padding:12px 32px; background:var(--gold); color:var(--white); border-radius:8px; text-decoration:none; font-weight:600; transition:0.3s; }
.cta-banner .btn-cta:hover { background:var(--gold-light); transform:translateY(-2px); }

/* Footer */
.footer { background:var(--blue-deep); color:rgba(255,255,255,0.6); text-align:center; padding:24px; font-size:13px; margin-top:60px; }

@media (max-width: 768px) {
  .content-grid { grid-template-columns:1fr; }
  .features { grid-template-columns:1fr 1fr; }
  .process { flex-wrap:wrap; gap:16px; }
  .process-step { flex:0 0 calc(50% - 8px); }
  .process-step::after { display:none; }
}
</style>

// ====== PAGE INIT ======
const params = new URLSearchParams(window.location.search);
const serviceName = params.get('s') || '工商服务';
const data = services[serviceName];

if (!data) {
  document.querySelector('.hero h1').textContent = '服务未找到';
  document.querySelector('.hero p').textContent = '请返回服务列表选择';
} else {
  document.title = data.title + ' - 贝多财税';
  document.getElementById('heroIcon').innerHTML = '<i class="fa-solid ' + data.icon + '"></i>';
  document.getElementById('heroTitle').textContent = data.title;
  document.getElementById('heroDesc').textContent = data.desc;
  document.getElementById('formService').value = data.title;

  let html = '<h2>服务简介</h2><p>' + data.intro + '</p>';

  // Advantages
  html += '<div class="features">';
  data.advantages.forEach(a => {
    html += '<div class="feature-card"><i class="fa-solid ' + a.icon + '"></i><h4>' + a.title + '</h4><p>' + a.desc + '</p></div>';
  });
  html += '</div>';

  // Sections
  data.sections.forEach(s => {
    html += '<h3>' + s.title + '</h3><ul>';
    s.items.forEach(item => { html += '<li>' + item + '</li>'; });
    html += '</ul>';
  });

  document.getElementById('serviceContent').innerHTML = html;
}

// ====== FORM SUBMIT ======
document.getElementById('leadForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 提交中...';
  submitBtn.disabled = true;

  // Cloudflare 隧道代理
  const proxyUrl = 'https://2026-e34.pages.dev/api/submit';
  const timestamp = new Date().toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai' });

  fetch(proxyUrl, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      name: document.getElementById('formName').value || '',
      phone: document.getElementById('formPhone').value || '',
      company: document.getElementById('formCompany').value || '',
      needs: document.getElementById('formNeeds').value || '',
      timestamp: timestamp,
      service: document.getElementById('formService').value || ''
    })
  })
  .then(() => {
    document.getElementById('leadForm').style.display = 'none';
    document.getElementById('formSuccess').style.display = 'block';
    console.log('WeCom webhook sent');
  })
  .catch(() => {
    document.getElementById('leadForm').style.display = 'none';
    document.getElementById('formSuccess').style.display = 'block';
    console.warn('WeCom webhook failed');
  });
});
